name: CI

on:
  pull_request:
    branches: [dev, test, main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save wrangler@4
      - name: Build site
        run: node scripts/build.mjs
      - name: Worker tests (local D1 + mocked Gmail/Paystack)
        run: node --experimental-sqlite scripts/test-worker.mjs
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry
